<VirtualHost *:80>
    # Serve from project root (this repository contains index.php at the project root)
    DocumentRoot /var/www/html
    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        # Ensure no mod_rewrite redirect to HTTPS is active for this HTTP vhost
        RewriteEngine Off
        # Ensure any HSTS header set elsewhere is removed for this vhost
        <IfModule mod_headers.c>
            Header unset Strict-Transport-Security
        </IfModule>
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
