server {
    listen 80;
    server_name default;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Increase buffer sizes to handle large headers
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 32k;
    
    # Also increase proxy buffer sizes for good measure
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 32k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    location = /import-old {
        # Make sure it still routes through Laravel
        try_files $uri /index.php?$query_string;

        # Stop Nginx from giving up early
        fastcgi_read_timeout 36000s;   # 10 hours
        send_timeout         36000s;
        proxy_connect_timeout 36000s;  # harmless here but ok to keep

        # If you use buffering anywhere, keep php output flowing
        # (fastcgi doesn't have proxy buffering settings; this is fine)
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        
        # Override fastcgi buffer settings for PHP requests
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:env|ini|log)$ { deny all; }
    location ~* \.(?:git|svn|hg)$ { deny all; }

    client_max_body_size 64m;
}
