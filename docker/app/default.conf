server {
    listen 80;
    server_name default;
    root /var/www/html/public;
    index index.php index.html index.htm;

    # Increase buffer sizes to handle large headers
    fastcgi_buffer_size 32k;
    fastcgi_buffers 8 32k;
    fastcgi_busy_buffers_size 32k;
    
    # Also increase proxy buffer sizes for good measure
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 32k;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }
    location ^~ /livewire/ {
        try_files $uri /index.php?$query_string;
    }

    # Proxies the OnlyOffice Document Server's own web UI/API (editor JS,
    # websockets) through this container's single public port, so the
    # browser never needs a second exposed host/port for document editing.
    location ^~ /onlyoffice/ {
        proxy_pass http://onlyoffice-documentserver/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 200m;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
        
        # Override fastcgi buffer settings for PHP requests
        fastcgi_buffer_size 32k;
        fastcgi_buffers 8 32k;
        fastcgi_busy_buffers_size 32k;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(?:env|ini|log)$ { deny all; }
    location ~* \.(?:git|svn|hg)$ { deny all; }

    # Raised from 64m so DMS document/zip uploads aren't rejected at the
    # proxy before reaching PHP's own upload_max_filesize/post_max_size.
    client_max_body_size 200m;
}
