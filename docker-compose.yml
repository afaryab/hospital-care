version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: hospital-care-php73
    container_name: hospital-care-app
    volumes:
      - ./:/var/www/html:cached
      - ./docker/php/vhost.conf:/etc/apache2/sites-available/000-default.conf:ro
      - ./docker/php/php.ini:/usr/local/etc/php/php.ini:ro
    ports:
      - "8080:80"
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_DATABASE=hospital_care
      - DB_USERNAME=hc_user
      - DB_PASSWORD=hc_password
      - HTTPS=true
      - APP_URL=hallowed-spooky-mausoleum-7wwp7qpj6553x97v-8080.app.github.dev
    depends_on:
      - db

  db:
    image: mysql:5.7
    container_name: hospital-care-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: hospital_care
      MYSQL_USER: hc_user
      MYSQL_PASSWORD: hc_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  pma:
    image: phpmyadmin/phpmyadmin
    container_name: hospital-care-pma
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: hc_user
      PMA_PASSWORD: hc_password
    ports:
      - "8081:80"
    depends_on:
      - db
    volumes:
      - ./uploads:/var/www/html/upload

volumes:
  db_data:
