  laravel:
    build:
      context: .
      dockerfile: docker/laravel-php/Dockerfile
    volumes:
      - ./laravel:/var/www/html
      - ./docker/laravel-php/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    environment:
      - APP_NAME=HospitalCare
      - APP_ENV=development
      - APP_DEBUG=true
      - APP_URL=localhost
      - REGISTER_PATIENT_PUBLICLY=true
      - TAKE_APPOINTMENTS_PUBLICLY=true
    depends_on:
      - db

  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: hc_user
      MYSQL_PASSWORD: hc_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  pma:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 300M
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 512M
      POST_MAX_SIZE: 300M
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
  mysql_data:
