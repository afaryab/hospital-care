services:

  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/app/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/app/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    ports:
      - "80:80"
    environment:
      - APP_NAME=MedicalOS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - REGISTER_PATIENT_PUBLICLY=true
      - TAKE_APPOINTMENTS_PUBLICLY=true
      - SESSION_DOMAIN=localhost
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ONLYOFFICE_INTERNAL_URL=http://onlyoffice-documentserver
      - ONLYOFFICE_JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-jwt-secret}
    depends_on:
      - db
      - redis
      - onlyoffice-documentserver

  cli:
    build:
      context: .
      dockerfile: docker/cli/Dockerfile
    volumes:
      - .:/var/www/html
      - ./docker/cli/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/cli/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf
    environment:
      - APP_NAME=MedicalOS
      - APP_ENV=local
      - APP_DEBUG=true
      - APP_URL=http://localhost
      - REGISTER_PATIENT_PUBLICLY=true
      - TAKE_APPOINTMENTS_PUBLICLY=true
      - SESSION_DOMAIN=localhost
      - CACHE_STORE=redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis

  # Self-hosted document editor powering in-browser Word/Excel/PowerPoint
  # editing from the Document Manager. Reached only via the `app` nginx
  # proxy (see docker/app/default.conf's /onlyoffice/ location) and the
  # internal Docker network — no public port is exposed for it directly.
  # Recommend 2+ vCPU / 4GB+ RAM for this container in production.
  onlyoffice-documentserver:
    image: onlyoffice/documentserver:8.1
    restart: unless-stopped
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:-change-me-onlyoffice-jwt-secret}
      - JWT_HEADER=Authorization
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"

  db:
    image: mysql:8.0
    platform: linux/amd64
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_USER: hc_user
      MYSQL_PASSWORD: hc_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "3306:3306"

  pma:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root_password
      UPLOAD_LIMIT: 300M
      MAX_EXECUTION_TIME: 600
      MEMORY_LIMIT: 512M
      POST_MAX_SIZE: 300M
    ports:
      - "8080:80"
    depends_on:
      - db

volumes:
  db_data:
  mysql_data:
  redis_data:
  onlyoffice_data:
  onlyoffice_logs:
